data_cfg:
  dataset_name: CASIA-B
  dataset_root: ../../data/processed/CASIA-B-pkl-compatible
  num_workers: 1
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  remove_no_gallery: false
  cache: false
  test_dataset_name: CASIA-B
evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 30000
  save_name: GaitPart_Full_B32
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_size: 1
    sample_type: all_ordered
    type: InferenceSampler
  transform:
  - type: BaseSilCuttingTransform
  metric: euc
  cross_view_gallery: false
loss_cfg:
  loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet
model_cfg:
  model: GaitPart
  backbone_cfg:
    in_channels: 1
    layers_cfg:
    - BC-32
    - BC-32
    - M
    - FC-64-2
    - FC-64-2
    - M
    - FC-128-3
    - FC-128-3
    type: Plain
  SeparateFCs:
    in_channels: 128
    out_channels: 128
    parts_num: 16
  bin_num:
  - 16
optimizer_cfg:
  lr: 0.0001
  momentum: 0.9
  solver: Adam
  weight_decay: 0.0
scheduler_cfg:
  gamma: 0.1
  milestones:
  - 100000
  scheduler: MultiStepLR
trainer_cfg:
  find_unused_parameters: false
  enable_float16: true
  with_test: false
  fix_BN: false
  log_iter: 100
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 10000
  save_iter: 2000
  save_name: GaitPart_Full_B32
  sync_BN: false
  total_iter: 30000
  sampler:
    batch_shuffle: false
    batch_size:
    - 4
    - 8
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 25
    frames_skip_num: 10
    sample_type: fixed_ordered
    type: TripletSampler
  transform:
  - type: BaseSilCuttingTransform
